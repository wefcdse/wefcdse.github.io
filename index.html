<html lang="zh-CN">
<head>

<meta property="og:description" content="用 AI 做的小游戏合集。第一片海域：鱼群模拟。">

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23071b33'/%3E%3Cpath d='M12 32c8-10 22-12 30-4l9-8v24l-9-8c-8 8-22 6-30-4z' fill='%235fc8ff'/%3E%3Ccircle cx='24' cy='29' r='2.4' fill='%23071b33'/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #040a14;
    --bg-deep: #020610;
    --ink: #cfe6ff;
    --ink-dim: #7fb4e8;
    --ink-faint: #5a86b5;
    --line: rgba(90, 160, 240, .22);
    --line-hot: rgba(120, 190, 255, .55);
    --card: rgba(10, 40, 70, .38);
    --accent: #5fc8ff;
    --accent-soft: rgba(95, 200, 255, .14);
    --font: -apple-system, "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    min-height: 100vh;
    background:
      radial-gradient(1200px 700px at 15% -10%, rgba(24, 92, 160, .28), transparent 60%),
      radial-gradient(900px 600px at 92% 8%, rgba(20, 60, 120, .22), transparent 65%),
      linear-gradient(180deg, var(--bg) 0%, var(--bg-deep) 100%);
    background-attachment: fixed;
    color: var(--ink);
    font-family: var(--font);
    line-height: 1.6;
    overflow-x: hidden;
  }
  a { color: inherit; }
  #bubbles {
    position: fixed; inset: 0; width: 100%; height: 100%;
    pointer-events: none; z-index: 0; opacity: .55;
  }
  .wrap {
    position: relative; z-index: 1;
    max-width: 1060px; margin: 0 auto;
    padding: 26px 24px 48px;
    display: flex; flex-direction: column; min-height: 100vh;
  }
  header {
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
  }
  .brand {
    display: inline-flex; align-items: center; gap: 10px;
    text-decoration: none; font-size: 14px; letter-spacing: 3px; color: #a9d4ff;
  }
  .brand svg { width: 26px; height: 26px; flex: none; filter: drop-shadow(0 0 8px rgba(95, 200, 255, .45)); }
  .brand span { font-weight: 600; }
  nav { display: flex; align-items: center; gap: 22px; }
  nav a {
    text-decoration: none; font-size: 13px; letter-spacing: 1px;
    color: var(--ink-faint); transition: color .2s ease;
  }
  nav a:hover, nav a:focus-visible { color: var(--accent); }
  .hero { padding: clamp(70px, 13vh, 150px) 0 clamp(50px, 8vh, 90px); }
  .kicker {
    display: inline-flex; align-items: center; gap: 10px;
    font-size: 11px; letter-spacing: 4px; color: var(--accent);
    text-transform: uppercase; margin-bottom: 18px;
  }
  .kicker::before {
    content: ""; width: 28px; height: 1px;
    background: linear-gradient(90deg, transparent, var(--accent));
  }
  h1 {
    font-size: clamp(40px, 9vw, 76px);
    line-height: 1.08; font-weight: 600; letter-spacing: clamp(2px, 1vw, 8px);
    color: #dceeff;
    text-shadow: 0 0 42px rgba(80, 170, 255, .28);
  }
  .lead {
    margin-top: 20px; max-width: 30em;
    font-size: clamp(14px, 2vw, 17px); color: var(--ink-dim);
  }
  .actions { margin-top: 34px; display: flex; flex-wrap: wrap; gap: 14px; }
  .btn {
    display: inline-flex; align-items: center; gap: 9px;
    padding: 11px 22px; border-radius: 999px;
    font-size: 13px; letter-spacing: 1px; text-decoration: none;
    border: 1px solid transparent; transition: .2s ease;
  }
  .btn.primary {
    background: linear-gradient(135deg, #1d6fae, #12507f);
    border-color: rgba(130, 200, 255, .35);
    color: #e6f4ff;
    box-shadow: 0 8px 28px rgba(20, 110, 180, .28);
  }
  .btn.primary:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 34px rgba(40, 140, 220, .42);
    border-color: rgba(160, 220, 255, .6);
  }
  .btn.ghost {
    color: var(--ink-dim); border-color: var(--line);
    background: rgba(10, 30, 55, .25);
  }
  .btn.ghost:hover { color: var(--accent); border-color: var(--line-hot); }
  .section-head {
    display: flex; align-items: baseline; justify-content: space-between;
    gap: 16px; margin-bottom: 26px;
    border-bottom: 1px solid rgba(90, 160, 240, .12); padding-bottom: 14px;
  }
  .section-head h2 {
    font-size: 15px; font-weight: 500; letter-spacing: 4px; color: #bcdcff;
  }
  .section-head span { font-size: 11px; letter-spacing: 2px; color: var(--ink-faint); }
  .grid {
    display: grid; gap: 20px;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  }
  .card {
    position: relative; display: flex; flex-direction: column;
    text-decoration: none; color: var(--ink);
    background: var(--card);
    border: 1px solid var(--line); border-radius: 16px;
    padding: 16px 16px 18px; overflow: hidden;
    backdrop-filter: blur(8px);
    transition: transform .25s ease, border-color .25s ease, background .25s ease, box-shadow .25s ease;
  }
  a.card:hover, a.card:focus-visible {
    transform: translateY(-4px);
    border-color: var(--line-hot);
    background: rgba(18, 56, 92, .5);
    box-shadow: 0 18px 44px rgba(0, 40, 80, .5);
    outline: none;
  }
  .thumb {
    position: relative; height: 132px; border-radius: 10px; overflow: hidden;
    background:
      radial-gradient(120px 90px at 78% 16%, rgba(60, 170, 240, .4), transparent 70%),
      linear-gradient(160deg, #0a2440, #051426 70%);
    border: 1px solid rgba(90, 160, 240, .12);
  }
  .thumb svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .thumb .school { animation: drift 9s ease-in-out infinite alternate; transform-origin: center; }
  .thumb .school.b { animation-duration: 11s; animation-delay: -3s; opacity: .7; }
  .thumb .school.c { animation-duration: 13s; animation-delay: -6s; opacity: .45; }
  @keyframes drift {
    from { transform: translate3d(-6px, 4px, 0); }
    to   { transform: translate3d(8px, -6px, 0); }
  }
  .card h3 {
    margin-top: 16px; font-size: 17px; font-weight: 600; letter-spacing: 1px; color: #bfe1ff;
  }
  .card p {
    margin-top: 7px; font-size: 12.5px; line-height: 1.75; color: var(--ink-dim);
  }
  .tags {
    display: flex; flex-wrap: wrap; gap: 6px; list-style: none;
    margin-top: 14px;
  }
  .tags li {
    font-size: 10.5px; letter-spacing: .5px; color: #8ec4f0;
    padding: 3px 9px; border-radius: 999px;
    background: var(--accent-soft); border: 1px solid rgba(95, 200, 255, .16);
  }
  .go {
    margin-top: 16px; font-size: 12px; letter-spacing: 1px; color: var(--accent);
    display: inline-flex; align-items: center; gap: 6px;
  }
  .go::after { content: "→"; transition: transform .25s ease; }
  a.card:hover .go::after { transform: translateX(4px); }
  .card.soon {
    border-style: dashed; border-color: rgba(90, 160, 240, .18);
    background: rgba(8, 24, 44, .25);
    align-items: center; justify-content: center; text-align: center;
    min-height: 280px; padding: 32px;
  }
  .card.soon p { color: var(--ink-faint); }
  .card.soon b {
    display: block; font-size: 14px; letter-spacing: 2px;
    color: #7fa9d4; font-weight: 500; margin-bottom: 8px;
  }
  .card.soon .ripple {
    width: 46px; height: 46px; border-radius: 50%;
    border: 1px solid rgba(95, 200, 255, .35);
    position: relative; margin-bottom: 18px;
  }
  .card.soon .ripple::after {
    content: ""; position: absolute; inset: -8px; border-radius: 50%;
    border: 1px solid rgba(95, 200, 255, .14);
    animation: pulse 3.2s ease-out infinite;
  }
  @keyframes pulse {
    0%   { transform: scale(.85); opacity: .9; }
    100% { transform: scale(1.5); opacity: 0; }
  }
  footer {
    margin-top: auto; padding-top: 56px;
    display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px;
    font-size: 11.5px; letter-spacing: 1px; color: var(--ink-faint);
    border-top: 1px solid rgba(90, 160, 240, .1);
  }
  footer a { color: var(--ink-faint); text-decoration: none; }
  footer a:hover { color: var(--accent); }
  :focus-visible { outline: 1px solid var(--accent); outline-offset: 3px; }
  @media (max-width: 560px) {
    .wrap { padding: 20px 18px 36px; }
    nav { gap: 16px; }
    .card.soon { min-height: 220px; }
    footer { flex-direction: column; }
  }
  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    #bubbles { display: none; }
    .thumb .school, .card.soon .ripple::after { animation: none; }
    * { transition: none !important; }
  }
</style>
</head>
<body>
<canvas id="bubbles" aria-hidden="true"></canvas>

<div class="wrap">
  <header>
    <a class="brand" href="/">
      <svg viewBox="0 0 64 64" aria-hidden="true">
        <path d="M8 32c9-11 25-13 34-4l10-9v26l-10-9c-9 9-25 7-34-4z" fill="#5fc8ff" opacity=".9"/>

      <span>DEEP SEA ARCADE</span>

    <nav>
      <a href="#games">游戏</a>

      <div class="actions">

                  <path d="M66 78c5-6 14-7 19-2l5-4v12l-5-4c-5 5-14 4-19-2z" opacity=".7"/>
                </g>
                <g class="school b">
                  <path d="M168 46c9-10 24-11 32-2l9-7v19l-9-7c-8 9-23 8-32-3z" opacity=".9"/>
                  <path d="M212 74c6-7 16-8 22-2l6-5v14l-6-5c-6 6-16 5-22-2z" opacity=".75"/>

<script>
(function () {
  var reduced = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (reduced) return;

  var canvas = document.getElementById("bubbles");
  var ctx = canvas.getContext("2d");
  var w = 0, h = 0, dpr = 1, bubbles = [], raf = 0;
  var COUNT = 42;

  function make() {
    return {
      x: Math.random() * w,
      y: h + Math.random() * h,
      r: 0.8 + Math.random() * 2.6,
      v: 6 + Math.random() * 16,
      sway: Math.random() * Math.PI * 2,
      swaySpeed: 0.4 + Math.random() * 0.9,
      alpha: 0.08 + Math.random() * 0.22
    };
  }

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    w = window.innerWidth;
    h = window.innerHeight;
    canvas.width = Math.floor(w * dpr);
    canvas.height = Math.floor(h * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    bubbles = [];
    for (var i = 0; i < COUNT; i++) {
      var b = make();
      b.y = Math.random() * h;
      bubbles.push(b);
    }
  }

  var last = 0;
  function frame(t) {
    var dt = last ? Math.min((t - last) / 1000, 0.05) : 0;
    last = t;
    ctx.clearRect(0, 0, w, h);
    for (var i = 0; i < bubbles.length; i++) {
      var b = bubbles[i];
      b.y -= b.v * dt;
      b.sway += b.swaySpeed * dt;
      if (b.y < -12) {
        b.y = h + 12;
        b.x = Math.random() * w;
      }
      var x = b.x + Math.sin(b.sway) * 7;
      ctx.beginPath();
      ctx.arc(x, b.y, b.r, 0, Math.PI * 2);
      ctx.strokeStyle = "rgba(140, 205, 255, " + b.alpha + ")";
      ctx.lineWidth = 1;
      ctx.stroke();
    }
    raf = requestAnimationFrame(frame);
  }

  function start() {
    if (raf) return;
    last = 0;
    raf = requestAnimationFrame(frame);
  }
  function stop() {
    if (!raf) return;
    cancelAnimationFrame(raf);
    raf = 0;
  }

  window.addEventListener("resize", resize, { passive: true });
  document.addEventListener("visibilitychange", function () {
    if (document.hidden) stop(); else start();
  });
  resize();
  start();
})();
</script>
